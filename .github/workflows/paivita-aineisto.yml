name: Päivitä verotuspäätökset

on:
  schedule:
    # Kuukauden 12. päivä klo 5.00 UTC. Verohallinto täydentää taulukoita yleensä kuun alussa.
    - cron: "0 5 12 * *"
  # Mahdollistaa käsin käynnistämisen Actions-välilehdeltä ("Run workflow")
  workflow_dispatch:
  # Ajetaan myös, kun data/raaka/-kansioon lisätään käsin ladattu Excel, data/palaute/-kansioon
  # kauppiaiden arvioita koulutustilasta tai kalibrointia muutetaan (data/kalibrointi.json)
  push:
    paths:
      - "data/raaka/**"
      - "data/palaute/**"
      - "data/kalibrointi.json"

permissions:
  contents: write

concurrency:
  group: aineiston-paivitys
  cancel-in-progress: false

jobs:
  paivita:
    # Kiinteä versio: ubuntu-latest vaihtuu Ubuntu 26:een 19.10.2026 alkaen
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Asenna Excel-lukijat
        run: pip install xlrd==2.0.1 openpyxl

      - name: Hae Verohallinnon taulukot
        run: python tyokalut/hae_aineisto.py --vuosia 4

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Opeta malli ja mittaa tarkkuus
        run: node tyokalut/rakenna_malli.mjs

      - name: Tallenna päivitetty aineisto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/*.json data/merkit/
          if git diff --cached --quiet; then
            echo "Aineisto ei muuttunut."
            exit 0
          fi
          git commit -m "Aineiston päivitys $(date -u +%Y-%m-%d)"
          git push
